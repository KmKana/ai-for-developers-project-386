# Окружение разработки проекта «Запись на звонок».
# Инструменты: https://mise.jdx.dev — после установки mise выполните
# `mise install` (скачает версии ниже) и `mise run install` (зависимости проекта).

[settings]
# experimental нужен для daemons (фоновые dev-серверы).
experimental = true

[tools]
java = "21"
maven = "3.9.6"
node = "24.22.3"
# Менеджер процессов для [daemons]; если mise скажет, что версии нет,
# посмотрите актуальный тег на https://github.com/jdx/pitchfork/releases
pitchfork = "2.36.0"

# --- Установка ---

[tasks.install]
description = "Установить зависимости бэкенда и фронтенда"
depends = ["install-backend", "install-contract", "install-frontend"]

[tasks.install-backend]
description = "Собрать бэкенд и скачать зависимости"
dir = "backend"
run = "mvn -B -DskipTests package"

[tasks.install-contract]
description = "Установить зависимости генерации контракта (TypeSpec)"
dir = "api/tsp"
run = "npm ci"

[tasks.install-frontend]
description = "Установить npm-зависимости фронтенда"
dir = "frontend"
run = "npm install"

# --- Проверки ---

[tasks.lint]
description = "Все линтеры: Spotless (Java), ESLint и Prettier (фронтенд)"
depends = ["lint-backend", "lint-frontend"]

[tasks.lint-backend]
description = "Проверка формата Java (Spotless)"
dir = "backend"
run = "mvn -B spotless:check"

[tasks.lint-frontend]
description = "ESLint и Prettier на фронтенде"
dir = "frontend"
run = "npm run lint && npm run format:check"

[tasks.test]
description = "Тесты бэкенда (JUnit 5), включая дымовой тест запуска"
dir = "backend"
run = "mvn -B test"

[tasks.test-frontend]
description = "Тесты фронтенда (Vitest)"
dir = "frontend"
run = "npm run test"

[tasks.build-frontend]
description = "Проверка типов и сборка фронтенда"
dir = "frontend"
run = "npm run build"

[tasks.check-contract]
description = "Проверить расхождение OpenAPI и SDK с TypeSpec"
run = "node scripts/check-contract-artifacts.mjs"

[tasks.check]
description = "Единая команда всех проверок: линтеры + тесты + сборка + контракт"
depends = ["lint", "test", "test-frontend", "build-frontend", "check-contract"]

# --- Разработка ---

[tasks.backend]
description = "Запустить бэкенд на :8080"
dir = "backend"
run = "mvn spring-boot:run"

[tasks.frontend]
description = "Запустить фронтенд на :5173"
dir = "frontend"
run = "npm run dev"

[tasks.hooks]
description = "Включить git-хуки (pre-commit прогоняет линтеры)"
run = "git config core.hooksPath .githooks"

# --- Фоновые процессы (нужен experimental = true) ---

[daemons.backend]
description = "Spring Boot на :8080"
dir = "backend"
run = "mvn spring-boot:run"

[daemons.frontend]
description = "Vite dev-сервер на :5173"
dir = "frontend"
run = "npm run dev"
